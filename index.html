<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>반차 결재 대작전</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<style>
/* Layout: a floating two-level IT office (B1 parking + office) on top; a paper approval form docked at the bottom */
:root{
  --sheet:#fffdf7;--ink:#2d2a26;--muted:#857b70;--rule:rgba(45,42,38,.12);--chip:#f1ece2;
  --stamp:#d8382f;--accent:#2f6fd6;--ok:#3f9a6e;--gold:#f2b544;
  --f-display:"Jua","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--sheet:#24262e;--ink:#f3efe7;--muted:#b3ab9f;--rule:rgba(243,239,231,.14);--chip:#31343e;color-scheme:dark}}
:root[data-theme="dark"]{--sheet:#24262e;--ink:#f3efe7;--muted:#b3ab9f;--rule:rgba(243,239,231,.14);--chip:#31343e;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:#cfe6f7;color:var(--ink);font-family:var(--f-body);font-size:14px;overflow:hidden;-webkit-tap-highlight-color:transparent;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
[hidden]{display:none!important}
#stage{position:fixed;left:0;right:0;top:0;height:60%;overflow:hidden;background:linear-gradient(180deg,#8ccaf2,#e3f3fc)}
#stage canvas{display:block;touch-action:none}
#overlay{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.tag{position:absolute;left:0;top:0;white-space:nowrap;font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;background:rgba(255,253,247,.92);color:#2d2a26;box-shadow:0 2px 6px rgba(0,0,0,.15)}
.tag.pop{background:#2f6fd6;color:#fff;transition:opacity .2s}
.bub{position:absolute;left:0;top:0;max-width:min(230px,60vw);font-size:14px;line-height:1.4;background:#fff;color:#2d2a26;padding:8px 12px 9px;border-radius:16px;
  box-shadow:0 6px 18px rgba(0,0,0,.2);opacity:0;transition:opacity .2s;white-space:normal;word-break:keep-all}
.bub b{display:block;font-family:var(--f-display);font-weight:400;font-size:12px;color:#c0392b;margin-bottom:1px}
.bub::after{content:"";position:absolute;left:50%;bottom:-7px;margin-left:-7px;border:7px solid transparent;border-bottom:0;border-top-color:#fff}
.bub.me{background:#eaf2ff}.bub.me b{color:var(--accent)}.bub.me::after{border-top-color:#eaf2ff}
.bub.think{background:#f6f3ff;border-radius:22px;color:#4a4458}
.bub.think b{color:#7c5cc4}
.bub.think::after{border:0;width:12px;height:12px;border-radius:50%;background:#f6f3ff;bottom:-10px;margin-left:-14px;box-shadow:-9px 9px 0 -3px #f6f3ff}
.stampfx{position:absolute;left:0;top:0;width:96px;height:96px;margin:-48px 0 0 -48px;border:5px solid var(--stamp);border-radius:50%;color:var(--stamp);
  font-family:var(--f-display);font-size:30px;display:grid;place-items:center;transform:rotate(-14deg) scale(2.2);opacity:0;background:rgba(255,255,255,.6)}
.stampfx.no{border-color:#333;color:#333}
.stampfx.on{animation:stamp .5s cubic-bezier(.2,1.6,.4,1) forwards}
@keyframes stamp{to{transform:rotate(-14deg) scale(1);opacity:1}}
.boom{position:absolute;left:0;top:0;font-family:var(--f-display);font-size:64px;color:#ff5a1f;-webkit-text-stroke:3px #fff;opacity:0;transform:scale(.3)}
.boom.on{animation:boom 1.6s ease-out forwards}
@keyframes boom{15%{opacity:1;transform:scale(1.25)}60%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1.1)}}
#confetti{position:absolute;inset:0;pointer-events:none}

.top{position:fixed;top:0;left:0;right:0;z-index:5;pointer-events:none;padding-top:calc(env(safe-area-inset-top,0px) + 12px);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;justify-content:space-between;gap:10px}
.brand{background:rgba(255,253,247,.95);color:#2d2a26;border-radius:18px;padding:8px 12px;box-shadow:0 4px 14px rgba(0,0,0,.15)}
.brand h1{margin:0;font-family:var(--f-display);font-weight:400;font-size:19px;line-height:1.15}
.brand h1 b{color:var(--stamp);font-weight:400}
.brand p{margin:2px 0 0;font-size:11px;color:#857b70;font-weight:600}

#sheet{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--sheet);color:var(--ink);border-radius:24px 24px 0 0;
  padding-top:14px;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 12px);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:10px;box-shadow:0 -10px 30px rgba(20,30,50,.2)}
.form-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.form-h h2{margin:0;font-family:var(--f-display);font-weight:400;font-size:17px}
.form-h span{font-size:11.5px;color:var(--muted)}
.stamps{display:grid;grid-template-columns:repeat(3,1fr);border:1.5px solid var(--ink);border-radius:6px;overflow:hidden}
.box{border:0;border-left:1px solid var(--ink);display:flex;flex-direction:column;min-width:0;cursor:pointer;background:transparent;color:inherit;font:inherit;padding:0}
.box:first-child{border-left:0}
.box .r{font-size:11px;font-weight:600;text-align:center;padding:3px 2px;border-bottom:1px solid var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:var(--chip)}
.box .s{height:44px;display:grid;place-items:center}
.box .s i{width:38px;height:38px;border-radius:50%;border:2.5px solid var(--stamp);color:var(--stamp);font-style:normal;font-family:var(--f-display);font-size:12px;
  display:grid;place-items:center;transform:rotate(-14deg);opacity:0;transition:opacity .2s}
.box.done .s i{opacity:1}
.box.rej .s i{border-color:var(--ink);color:var(--ink)}
.box.now .r{background:var(--gold);color:#2d2410}
.box:focus-visible,.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.scene{display:flex;flex-direction:column;gap:4px;min-height:84px}
.scene .who{font-size:12px;font-weight:600;color:var(--accent)}
.scene h3{margin:0;font-family:var(--f-display);font-weight:400;font-size:21px}
.scene p{margin:0;font-size:13.5px;line-height:1.55;min-height:2.6em}
#choice{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
#choice span{font-size:13px;font-weight:600;flex:1 1 100%}
#choice .btn{flex:1}
#okBtn{background:var(--ok);color:#fff}#noBtn{background:#3b3f4c;color:#fff}
.ctrls{display:flex;gap:8px}
.btn{border:0;background:var(--chip);color:var(--ink);border-radius:14px;height:44px;min-width:44px;padding:0 12px;font:inherit;font-size:13px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;cursor:pointer}
.btn svg{width:16px;height:16px;fill:currentColor}
.btn.play{flex:1;background:var(--accent);color:#fff;font-family:var(--f-display);font-size:16px;font-weight:400;box-shadow:0 3px 0 #1f4f9e}
.btn.on{background:var(--gold);color:#2d2410}
#err{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:24px;color:#2d2a26}
@media (min-width:760px){#sheet{left:auto;right:16px;bottom:16px;width:400px;border-radius:24px}}
@media (prefers-reduced-motion:reduce){.stampfx.on,.boom.on{animation:none;opacity:1;transform:none}}
</style>
</head>
<body>
<div id="stage"><div id="overlay"></div><canvas id="confetti"></canvas></div>
<div class="top"><div class="brand"><h1>반차 <b>결재</b> 대작전</h1><p id="sub">결재 0 / 3</p></div></div>

<section id="sheet" aria-label="반차 신청서">
  <div class="form-h"><h2>반차 신청서</h2><span id="leave"></span></div>
  <div class="stamps" id="stamps"></div>
  <div class="scene">
    <div class="who" id="who"></div>
    <h3 id="title"></h3>
    <p id="line"></p>
  </div>
  <div id="choice" hidden><span>지사장님 결재 결과는?</span><button class="btn" id="okBtn" type="button">승인 🎉</button><button class="btn" id="noBtn" type="button">반려 😭</button></div>
  <div class="ctrls">
    <button class="btn" id="prev" aria-label="이전 장면"><svg viewBox="0 0 24 24"><path d="M15.5 4 7 12l8.5 8 1.5-1.6L10.2 12 17 5.6z"/></svg></button>
    <button class="btn play" id="play">일시정지</button>
    <button class="btn" id="next" aria-label="다음 장면"><svg viewBox="0 0 24 24"><path d="M8.5 4 17 12l-8.5 8L7 18.4 13.8 12 7 5.6z"/></svg></button>
    <button class="btn" id="other" type="button">다른 결말</button>
  </div>
</section>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/geometries/RoundedBoxGeometry.js"></script>
<script>
/* =====================================================================
   여기만 고치면 돼요: 등장인물 · 대사 (실명 대신 역할/별명만)
   대사 앞의 이름: me=나, s1=주임님(처음 결재), s2=오른쪽 사수님, lead=팀장님, boss=지사장님,
   shiun/heeyeon/sunhye=시운/희연/선혜 주임님.  'think'가 붙으면 속마음 말풍선이에요.

const CAST={
 me:     {name:'나',fig:'me'},

 shiun:  {name:'시운 주임님',fig:'shiun'},
 heeyeon:{name:'희연 주임님',fig:'heeyeon'},
 sunhye: {name:'선혜 주임님',fig:'sunhye'}
};
const LEAVE='18일 · 오후 반차';
const SCRIPT={
 lift:[['me','아 진심 18일 오후반차 쓴다.','think'],['me','써야 된다.','think'],['me','쓰게 해 줘라…','think'],['me','못 쓰게 하기만 해 봐라 💢','think']],
 ponder:[['me','말할까… 말까…','think'],['me','그래, 지금이다.','think']],
 s1:[['me','주임님, 저 18일 오후에 반차 좀 써도 될까요?'],
     ['s2','대체휴가는 다 못 썼는데… 나 때는~'],['s2','나는 작년에 한 4개 남았었다~'],
     ['me','어쩌라고 씨발..','think'],
     ['s1','네, 쓰세요. 일정만 공유해 주세요.'],['me','감사합니다!!']],
 lead:[['lead','○○ 주임한테 컨펌 받았어요?'],['me','넵. 받았습니다.'],['lead','OK. 올려요.']],
 boss:[['me','지사장님께 결재 상신… 제발!']],
 bossOk:[['me','승인 떴다!!! 🎉']],
 bossNo:[['me','반려…? 왜요… 😱']],
 girlsChat:[['shiun','오늘 커피 뭐 드세요?'],['heeyeon','저는 바닐라라떼요 ㅎㅎ'],['sunhye','저는 아아 수혈이요…']],
 girlsOk:[['me','주임님들!! 저 18일 오후 반차 승인 났어요!!'],['shiun','와 축하드려요!! 잘 쉬다 오세요 ♡'],['heeyeon','너무 부러워요… 뭐 하실 거예요??'],['sunhye','반차 성공 축하드려요 🎉'],['me','일단 낮잠부터 자려고요 ㅎㅎ'],['shiun','최고의 계획이에요 ㅎㅎ'],['heeyeon','맛있는 거 드시고 사진 보내 주세요!!'],['sunhye','진짜 부러워요~ 잘 다녀오세요!']],
 girlsNo:[['me','주임님들… 저 반차 반려됐어요 😭'],['sunhye','네?? 회사 폭파시켜 드릴까요? 💢'],['heeyeon','회사 진짜 거지네요 거지!!'],['shiun','회사 바보예요… 제가 혼내 드릴게요!!'],['sunhye','지사장실 쳐들어가요 💢'],['heeyeon','저희가 대신 화내 드릴게요!!'],['shiun','회사 폭파 3, 2, 1…']]
};

(async function(){
try{await Promise.race([document.fonts.load('40px Jua'),new Promise(r=>setTimeout(r,1500))]);}catch(e){}
const $=s=>document.querySelector(s);const stage=$('#stage'),sheet=$('#sheet'),overlay=$('#overlay');
$('#leave').textContent=LEAVE;
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
let renderer;
try{renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});}catch(e){stage.insertAdjacentHTML('beforeend','<div id="err">이 기기에서는 3D 사무실을 열 수 없어요.</div>');return;}
const mobile=Math.min(screen.width,screen.height)<700;
renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.outputEncoding=THREE.sRGBEncoding;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.05;
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.setClearColor(0,0);
stage.insertBefore(renderer.domElement,stage.firstChild);
const scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(30,1,1,900);
const controls=new THREE.OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.dampingFactor=.08;controls.maxPolarAngle=1.5;controls.minDistance=8;controls.maxDistance=260;controls.screenSpacePanning=false;

/* kit */
const CL=h=>new THREE.Color(h).convertSRGBToLinear();
const cache={};const M=(h,o)=>{const k=h+(o?JSON.stringify(o):'');if(cache[k])return cache[k];const m=new THREE.MeshStandardMaterial(Object.assign({color:CL(h),roughness:.8},o||{}));if(o&&o.emissive!==undefined)m.emissive=CL(o.emissive);return cache[k]=m;};
const basic=(c,o={})=>new THREE.MeshBasicMaterial(Object.assign({color:CL(c)},o));
function mesh(geo,mat,x=0,y=0,z=0,parent=scene,cast=true,recv=true){const m=new THREE.Mesh(geo,mat);m.position.set(x,y,z);m.castShadow=cast;m.receiveShadow=recv;parent.add(m);return m;}
const RB=(w,h,d,r=.15)=>new THREE.RoundedBoxGeometry(w,h,d,2,Math.max(.01,Math.min(r,w/2-.01,h/2-.01,d/2-.01)));
function canvasTex(draw,w=128,h=w){const c=document.createElement('canvas');c.width=w;c.height=h;draw(c.getContext('2d'),w,h);const t=new THREE.CanvasTexture(c);t.encoding=THREE.sRGBEncoding;t.wrapS=t.wrapT=THREE.RepeatWrapping;t.anisotropy=4;return t;}
function signTex(text,bg,fg='#fff'){return canvasTex((g,w,h)=>{g.fillStyle=bg;g.beginPath();g.roundRect?g.roundRect(4,4,w-8,h-8,16):g.rect(4,4,w-8,h-8);g.fill();g.fillStyle=fg;g.textAlign='center';g.textBaseline='middle';
  let fs=50;g.font=fs+'px Jua,sans-serif';while(g.measureText(text).width>w-30&&fs>18){fs-=2;g.font=fs+'px Jua,sans-serif';}g.fillText(text,w/2,h/2+3);},320,96);}
function sign(text,bg,x,y,z,w=3,ry=0,fg){const m=new THREE.Mesh(new THREE.PlaneGeometry(w,w*.3),new THREE.MeshStandardMaterial({map:signTex(text,bg,fg),roughness:.7}));m.position.set(x,y,z);m.rotation.y=ry;scene.add(m);return m;}

/* lights */
scene.add(new THREE.HemisphereLight(0xeef6ff,0x9a8f84,.85));
const sun=new THREE.DirectionalLight(0xfff3e2,1.45);sun.position.set(-40,70,45);sun.castShadow=true;const SM=mobile?1536:2048;sun.shadow.mapSize.set(SM,SM);
Object.assign(sun.shadow.camera,{left:-50,right:50,top:50,bottom:-50,near:10,far:200});sun.shadow.bias=-.0004;sun.shadow.normalBias=.03;scene.add(sun);
const GY=-9;
[[-12,GY+5,6],[12,GY+5,6]].forEach(([x,y,z])=>{const l=new THREE.PointLight(0xfff1d8,1.1,40,1.6);l.position.set(x,y,z);scene.add(l);});

/* ================= building: B1 parking + office floor ================= */
const FX=30,FZ=24;
const woodTex=canvasTex((g,s)=>{for(let i=0;i<8;i++){const v=200+((i*37)%28);g.fillStyle=`rgb(${v},${v-35},${v-80})`;g.fillRect(0,i*s/8,s,s/8);g.fillStyle='rgba(90,60,30,.25)';g.fillRect(0,i*s/8,s,1.5);g.fillRect(((i*53)%s),i*s/8,1.5,s/8);}},256);woodTex.repeat.set(10,8);
mesh(RB(FX*2+1,1.6,FZ*2+1,.3),M(0xd9d4cc),0,-.8,0);
const floor=mesh(new THREE.PlaneGeometry(FX*2,FZ*2),new THREE.MeshStandardMaterial({map:woodTex,roughness:.7}),0,.01,0,scene,false,true);floor.rotation.x=-Math.PI/2;
// parking level
const concrete=M(0x9c9a96,{roughness:.95}),garageFloor=M(0x7c7f86,{roughness:.9});
mesh(RB(FX*2+1,1.8,FZ*2+1,.3),M(0x8f8a82),0,GY-.9,0);mesh(new THREE.BoxGeometry(FX*2,.04,FZ*2),garageFloor,0,GY+.02,0,scene,false,false);
mesh(RB(FX*2-1,1.2,FZ*2-1,.5),M(0x7a756d),0,GY-2.2,0,scene,false,false);
mesh(new THREE.BoxGeometry(FX*2+.5,-GY-1.6,.5),concrete,0,(GY-1.6)/2,-FZ-.25,scene,false,false);mesh(new THREE.BoxGeometry(.5,-GY-1.6,FZ*2+.5),concrete,-FX-.25,(GY-1.6)/2,0,scene,false,false);
for(let x=-24;x<=24;x+=12)for(let z=-16;z<=16;z+=16){mesh(RB(1,-GY-1.6,1,.1),M(0xb7b3ac),x,(GY-1.6)/2,z,scene,false,false);mesh(new THREE.BoxGeometry(1.05,.5,1.05),M(0xf2c94c),x,GY+.25,z,scene,false,false);}
for(let x=-26;x<=26;x+=4.4){[[-10,-1],[10,1]].forEach(([z])=>{mesh(new THREE.BoxGeometry(.12,.03,5),M(0xffffff),x,GY+.05,z,scene,false,false);});}
mesh(new THREE.BoxGeometry(56,.03,.14),M(0xf2c94c),0,GY+.05,0,scene,false,false);
const lightStrip=M(0xffffff,{emissive:0xfff3d8,emissiveIntensity:1});for(let x=-22;x<=22;x+=11)mesh(new THREE.BoxGeometry(5,.1,.3),lightStrip,x,-1.65,0,scene,false,false);
sign('B1','#2b2e36',-FX+.3,GY+5,-6,2,Math.PI/2);sign('출구 →','#3f9a6e',FX-1,GY+4,-6,3,-Math.PI/2);sign('EV 충전','#2f6fd6',-FX+.3,GY+3.5,-14,2.4,Math.PI/2);
mesh(RB(.8,1.6,.5,.1),M(0xe8eaee),-FX+.7,GY+.8,-14);
// low silver sports coupe: one side profile extruded across the width, round lamps, rear light bar
function carProfile(){const sh=new THREE.Shape();sh.moveTo(2.25,.38);sh.quadraticCurveTo(2.42,.5,2.36,.76);sh.quadraticCurveTo(2.25,.98,1.55,1.02);sh.lineTo(.78,1.1);
  sh.quadraticCurveTo(.25,1.62,-.45,1.6);sh.quadraticCurveTo(-1.55,1.5,-2.2,.98);sh.quadraticCurveTo(-2.42,.72,-2.3,.42);sh.lineTo(2.25,.38);return sh;}
function glassProfile(){const sh=new THREE.Shape();sh.moveTo(.7,1.14);sh.quadraticCurveTo(.24,1.56,-.42,1.54);sh.quadraticCurveTo(-1.25,1.46,-1.62,1.2);sh.lineTo(.7,1.14);return sh;}
const bodyGeo=new THREE.ExtrudeGeometry(carProfile(),{depth:1.7,bevelEnabled:true,bevelThickness:.22,bevelSize:.16,bevelSegments:4,curveSegments:16});bodyGeo.rotateY(-Math.PI/2);bodyGeo.translate(.85,0,0);

  if(a.t==='stamp'){st.stamps[a.box]=a.text;stamp(a.text,a.at);a.dur=1.5;}
  if(a.t==='send'){flying={from:V3(0,2.3,ROW_Z-.3),to:a.to};docMesh.visible=true;docTag.textContent=a.label;a.pop&&(popEl.textContent=a.pop);a.dur=2.2;}
  if(a.t==='choice'){if(st.result){next();return;}$('#choice').hidden=false;a.dur=Infinity;}
  if(a.t==='bossResult'){const ok=st.result!=='no';st.q.unshift(...say(ok?SCRIPT.bossOk:SCRIPT.bossNo));st.stamps[2]=ok?'승인':'반려';stamp(ok?'승인':'반려','boss');a.dur=1.5;}
  if(a.t==='mood'){st.mood=a.v;a.dur=0;}
  if(a.t==='boom'){boom();a.dur=2.4;}
  if(a.t==='confetti'){burst();a.dur=1;}
  if(a.t==='end'){a.dur=Infinity;setPlay(false);}
  render();
}
function stamp(text,at){stampEl.textContent=text;stampEl.classList.toggle('no',text==='반려');stampEl.dataset.at=at;stampEl.classList.remove('on');void stampEl.offsetWidth;stampEl.classList.add('on');}
function setPlay(p){st.playing=p;$('#play').textContent=p?'일시정지':(st.a&&st.a.t==='end'?'처음부터':'재생');}
function render(){
  const s=STEPS[st.i];
  BOXES.forEach((b,i)=>{const el=$('#box'+i);const v=st.stamps[i];el.classList.toggle('done',!!v);el.classList.toggle('rej',v==='반려');el.querySelector('i').textContent=v||'';el.classList.toggle('now',i+2===st.i);});
  const n=Object.values(st.stamps).filter(v=>v==='승인').length;$('#sub').textContent=st.stamps[2]==='반려'?'반려됨 💢':'결재 '+n+' / 3';
  $('#who').textContent=s.who;$('#title').textContent=s.title;const a=st.a;
  if(!a)return;
  $('#line').textContent=a.t==='drive'?'주차하는 중… 🚗':a.t==='walk'?'걸어가는 중…':a.t==='liftRide'||a.t==='liftWait'?'올라가는 중… 🛗':a.t==='say'?((a.think?'(속마음) ':CAST[a.who].name+': ')+a.text):a.t==='send'?'결재 올리는 중… 📨':a.t==='choice'?'지사장님 결재 결과는?':$('#line').textContent;
}
$('#prev').onclick=()=>go(st.i-1,true);$('#next').onclick=()=>go(st.i+1,true);
$('#play').onclick=()=>{if(!st.playing&&st.a&&st.a.t==='end'){go(0,true);return;}setPlay(!st.playing);};
function choose(r){st.result=r;$('#choice').hidden=true;if(st.a&&st.a.t==='choice')next();setPlay(true);}
$('#okBtn').onclick=()=>choose('ok');$('#noBtn').onclick=()=>choose('no');
$('#other').onclick=()=>{const r=st.result==='no'?'ok':'no';go(4,true);st.result=r;};
renderer.domElement.addEventListener('click',()=>{if(st.a&&st.a.t==='say')st.at=st.a.dur;});

/* flying document */
const docMesh=new THREE.Group();scene.add(docMesh);docMesh.visible=false;
mesh(RB(1,.7,.06,.03),M(0xffffff),0,0,0,docMesh,false);{const f=mesh(new THREE.ConeGeometry(.5,.35,3),M(0xd8382f),0,.18,.04,docMesh,false);f.rotation.z=Math.PI;f.scale.z=.1;}
let flying=null,popT=-99,popAt=null;

/* camera */
const OV_T=V3(0,-3,0),OV_O=V3(60,80,120);
let fly=null,camKey=null;camera.position.copy(OV_T).add(OV_O);controls.target.copy(OV_T);
function camFly(t,o){fly={t:0,fT:controls.target.clone(),fO:camera.position.clone().sub(controls.target),tT:t,tO:o};}
const focus=V3(20,GY,6);
const CAMS={garage:{o:V3(.42,.16,.9),d:40},lift:{o:V3(.35,.12,.93),d:22},row:{t:V3(0,1.6,5.6),o:V3(.3,.5,.85),d:17},lead:{o:V3(.4,.5,.85),d:18},boss:{t:V3(0,1.5,-6),o:V3(.45,.75,.75),d:48},girls:{t:V3(17.6,1.5,17.4),o:V3(.3,.5,.9),d:24}};

/* effects */
const cf=$('#confetti'),cx=cf.getContext('2d');let confettiOn=false,bits=[];
function burst(){confettiOn=true;bits=Array.from({length:reduced?40:150},()=>({x:Math.random()*W,y:-20-Math.random()*H*.5,vx:(Math.random()-.5)*60,vy:60+Math.random()*120,r:Math.random()*6.28,vr:(Math.random()-.5)*8,c:['#d8382f','#2f6fd6','#f2b544','#3f9a6e','#ff9ad5'][Math.floor(Math.random()*5)]}));}
const puffs=[];const puffGeo=new THREE.IcosahedronGeometry(1,2);let shake=0;
function boom(){boomEl.classList.remove('on');void boomEl.offsetWidth;boomEl.classList.add('on');shake=1.4;
  for(let i=0;i<26;i++){const m=new THREE.Mesh(puffGeo,new THREE.MeshStandardMaterial({color:CL(i%3?0x9a9a9a:0xf2a640),roughness:1,transparent:true,opacity:.9,emissive:CL(i%3?0x000000:0xff7a1a),emissiveIntensity:i%3?0:.8}));
    const a=Math.random()*Math.PI*2,r=Math.random()*8;m.position.set(Math.cos(a)*r,1+Math.random()*3,-14+Math.sin(a)*r);m.userData={v:V3(Math.cos(a)*4,4+Math.random()*5,Math.sin(a)*4),t:0};m.scale.setScalar(.6);scene.add(m);puffs.push(m);}}
const spriteFor=txt=>canvasTex((g,s)=>{g.font=(s*.75)+'px sans-serif';g.textAlign='center';g.textBaseline='middle';g.fillText(txt,s/2,s/2+4);},64);
const SPR={love:new THREE.SpriteMaterial({map:heartTex,transparent:true,depthWrite:false}),angry:new THREE.SpriteMaterial({map:spriteFor('💢'),transparent:true,depthWrite:false})};
const floaties=[];for(let i=0;i<14;i++){const sp=new THREE.Sprite(SPR.love);sp.visible=false;sp.scale.setScalar(.8);scene.add(sp);floaties.push({sp,t:0});}
let floatT=0;

/* animation */
const clock=new THREE.Clock();let phase=0,simT=0;const tmp=V3(0,0,0);let heroYaw=0;
function figAnim(g,walking,talking){const u=g.userData;g.rotation.y=u.lookYaw!=null?u.lookYaw:0;
  const sw=walking?Math.sin(phase)*.5:0;u.legs[0].rotation.x=sw;u.legs[1].rotation.x=-sw;
  u.card.position.y=walking?Math.abs(Math.cos(phase))*.08:talking?Math.abs(Math.sin(phase*1.2))*.05:0;
  u.card.rotation.x=talking?Math.sin(phase*1.4)*.025:0;u.card.rotation.z=0;
  u.card.scale.y=1+Math.sin(simT*2.2+u.breath)*.006;}
function pose(g,walking,talking){const u=g.userData;if(u.fig){figAnim(g,walking,talking);return;}const sw=walking?Math.sin(phase)*.55:0;
  if(!u.seated){u.legs[0].rotation.x=sw;u.legs[1].rotation.x=-sw;}else{u.legs[0].rotation.x=u.legs[1].rotation.x=-1.4;}
  u.arms[0].rotation.x=walking?-sw*.8:(talking?Math.sin(phase*1.7)*.3-.3:0);
  u.head.rotation.z=talking?Math.sin(phase*2.2)*.07:0;u.head.rotation.x=talking?Math.sin(phase*3)*.06:0;}
function place(el,v,dy=0){tmp.copy(v).project(camera);if(tmp.z>1||Math.abs(tmp.x)>1.15||Math.abs(tmp.y)>1.15){el.style.display='none';return false;}
  el.style.display='';el.style.transform='translate('+((tmp.x+1)/2*W).toFixed(1)+'px,'+((1-tmp.y)/2*H+dy).toFixed(1)+'px) translate(-50%,-100%)';return true;}
function headPos(id){const g=P[id];if(g.userData.fig)return g.position.clone().setY(g.position.y+g.userData.top+.15);return g.position.clone().setY(g.position.y+3.25*g.userData.scale/.85*(g.userData.seated?.9:1));}
const ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
function yawTo(cur,want,k){let d=want-cur;while(d>Math.PI)d-=Math.PI*2;while(d<-Math.PI)d+=Math.PI*2;return cur+d*k;}
function tick(){
  requestAnimationFrame(tick);const dt=Math.min(clock.getDelta(),.05);simT+=dt;const T=simT;phase+=dt*8;
  const s=STEPS[st.i];let a=st.a;
  if(st.playing&&a){st.at+=dt;
    if(a.t==='drive'){const k=Math.min(1,st.at/4.2);const p=sample(drivePath,ease(k));st.carPos.copy(p.pos);if(p.dir.lengthSq())st.carYaw=yawTo(st.carYaw,Math.atan2(p.dir.x,p.dir.z)+(k>.8?Math.PI:0)*0,Math.min(1,dt*5));a.dur=4.4;}
    if(a.t==='send'&&flying){const k=Math.min(1,st.at/1.8);const p=flying.from.clone().lerp(flying.to,k);p.y+=Math.sin(Math.PI*k)*6;docMesh.position.copy(p);docMesh.rotation.y=k*6;
      if(k>=1){docMesh.visible=false;popT=T;popAt=flying.to.clone();flying=null;}}
    if(a.t==='liftWait'){a.dur=st.liftT?Infinity:.4;}
    if(st.at>=(a.dur||0))next();
    if(!st.a&&st.playing){if(st.i<STEPS.length-1)go(st.i+1,false);else setPlay(false);}
  }
  a=st.a||{t:'idle'};
  // lift
  if(st.liftT){const k=Math.min(1,(T-st.liftT.t0)/st.liftT.dur);st.doorOpen=Math.max(0,1-k*6);st.liftY=GY+(0-GY)*ease(Math.min(1,Math.max(0,(k-.12)/.82)));if(k>=1){st.liftT=null;st.doorOpen=0;}}
  else if(a.t==='walk'||a.t==='idle'||st.i!==1)st.doorOpen=Math.min(1,st.doorOpen+dt*1.5);
  lift.position.y=st.liftY;doors[0].position.x=-.75-st.doorOpen*.7;doors[1].position.x=.75+st.doorOpen*.7;
  // car
  heroCar.position.copy(st.carPos);heroCar.rotation.y=st.carYaw;
  // hero
  let walking=false;
  if(a.t==='walk'){const k=Math.min(1,st.at/a.dur);const p=sample(a.path,k);hero.position.copy(p.pos);walking=st.playing;if(p.dir.lengthSq())heroYaw=yawTo(heroYaw,Math.atan2(p.dir.x,p.dir.z),Math.min(1,dt*8));}
  if(st.i===1&&(a.t==='liftRide'||a.t==='liftWait'||(a.t==='say'&&!walking))){hero.position.set(LX,st.liftY,LZ);heroYaw=yawTo(heroYaw,Math.PI*.15,dt*3);}
  hero.userData.seated=st.seated;
  if(st.seated){hero.position.y=seatY('me');}
  if(!walking&&st.face){let want=heroYaw;if(st.face==='desk')want=Math.PI;else if(st.face==='girls')want=Math.atan2(18-hero.position.x,17.8-hero.position.z);else if(P[st.face])want=Math.atan2(P[st.face].position.x-hero.position.x,P[st.face].position.z-hero.position.z);heroYaw=yawTo(heroYaw,want,Math.min(1,dt*6));}
  hero.userData.lookYaw=heroYaw;
  const talkWho=a.t==='say'?a.who:null;
  pose(hero,walking,talkWho==='me'&&!a.think);
  Object.keys(SEATS).forEach(id=>{const g=P[id];const engaged=(st.face===id||(st.face==='girls'&&['shiun','heeyeon','sunhye'].includes(id))||(st.i===2&&st.face==='s1'&&id==='s2'))&&a.t!=='walk';
    let w=g.userData.base;if(engaged)w=Math.atan2(hero.position.x-g.position.x,hero.position.z-g.position.z);
    if(id==='s2'&&talkWho==='s2')w=Math.atan2(P.s1.position.x-g.position.x,P.s1.position.z-g.position.z)*.3+w*.7;
    const u=g.userData;u.lookYaw=yawTo(u.lookYaw,w,Math.min(1,dt*4));if(!u.fig)g.rotation.y=u.lookYaw;pose(g,false,talkWho===id);
    g.position.y=seatY(id)+(st.mood==='angry'&&engaged?Math.abs(Math.sin(T*9+id.length))*.35:st.mood==='love'&&engaged&&talkWho===id?Math.abs(Math.sin(T*6))*.15:0);
    if(!u.fig)u.head.rotation.y=engaged?0:Math.sin(T*.6+id.length)*.2;});
  if(st.mood&&st.playing){floatT-=dt;if(floatT<=0){floatT=.22;const f=floaties.find(f=>!f.sp.visible);if(f){const id=['shiun','heeyeon','sunhye'][Math.floor(Math.random()*3)];f.sp.material=SPR[st.mood];f.sp.visible=true;f.t=0;f.sp.position.copy(headPos(id)).add(tmp.set((Math.random()-.5)*1.4,.2,(Math.random()-.5)*.6));}}}
  floaties.forEach(f=>{if(!f.sp.visible)return;f.t+=dt;f.sp.position.y+=dt*1.6;f.sp.scale.setScalar(.8*(1-f.t/2)+.2);if(f.t>1.8)f.sp.visible=false;});
  for(let i=puffs.length-1;i>=0;i--){const m=puffs[i],u=m.userData;u.t+=dt;m.position.addScaledVector(u.v,dt);u.v.multiplyScalar(.96);m.scale.setScalar(.6+u.t*2.2);m.material.opacity=Math.max(0,.9-u.t*.45);if(u.t>2.2){scene.remove(m);puffs.splice(i,1);}}
  ledA.emissiveIntensity=.4+.6*(Math.sin(T*7)>0?1:0);ledB.emissiveIntensity=.4+.6*(Math.sin(T*5+1)>0?1:0);
  // camera
  if(!st.over){const c=CAMS[s.cam];let tgt;
    if(s.cam==='garage')tgt=(hero.visible?hero.position:st.carPos).clone().setY(GY+1.5);
    else if(s.cam==='lift')tgt=V3(LX,st.liftY+2,LZ);
    else if(s.cam==='lead')tgt=hero.position.clone().lerp(P.lead.position,.5).setY(1.5);
    else tgt=c.t.clone();
    if(a.t==='walk'&&!['garage','lift'].includes(s.cam)){tgt=hero.position.clone().setY(1.5);}
    focus.lerp(tgt,1-Math.exp(-dt*4));
    const key=s.cam+(a.t==='walk'&&!['garage','lift'].includes(s.cam)?'w':'');
    if(camKey!==key){camKey=key;const o=(key.endsWith('w')?V3(.5,.72,.85).normalize().multiplyScalar(38):c.o.clone().normalize().multiplyScalar(c.d));camFly(null,o);}}
  if(fly){fly.t=Math.min(1,fly.t+dt/1.2);const e=ease(fly.t);const nt=fly.fT.clone().lerp(fly.tT||focus,e),no=fly.fO.clone().lerp(fly.tO,e);controls.target.copy(nt);camera.position.copy(nt).add(no);if(fly.t>=1)fly=null;}
  else{tmp.copy(focus).sub(controls.target);controls.target.add(tmp);camera.position.add(tmp);}
  controls.update();
  if(shake>0){shake=Math.max(0,shake-dt);const k=shake*.6;camera.position.x+=(Math.random()-.5)*k;camera.position.y+=(Math.random()-.5)*k;}
  clouds.forEach(([g,a2,r],i)=>{const na=a2+T*.01*(1+i%3*.3);g.position.x=Math.cos(na)*r;g.position.z=Math.sin(na)*r;});
  renderer.render(scene,camera);
  // overlay
  Object.keys(SEATS).forEach(id=>{const b=bubbles[id];const speaking=b&&T-b.t0<b.hold;const near=s.cam!=='garage'&&s.cam!=='lift';if(near&&!speaking)place(tags[id],headPos(id).add(tmp.set(0,.2,0)));else tags[id].style.display='none';});
  Object.entries(bubbles).forEach(([id,b])=>{const age=T-b.t0;if(age>b.hold){b.el.style.opacity=0;return;}
    const n=Math.min(b.text.length,Math.floor(age*28));b.el.querySelector('span').textContent=b.text.slice(0,n)||'…';b.el.style.opacity=1;
    place(b.el,headPos(id).add(tmp.set(0,.35,0)),-6);b.el.style.zIndex=String(Math.round(1000-age*10));});
  if(flying)place(docTag,docMesh.position.clone().add(tmp.set(0,1,0)));else docTag.style.display='none';
  if(T-popT<1.8&&popAt){popEl.style.opacity=1;place(popEl,popAt.clone().add(tmp.set(0,1.4+(T-popT)*.6,0)));}else popEl.style.opacity=0;
  if(stampEl.classList.contains('on'))place(stampEl,headPos(stampEl.dataset.at).add(tmp.set(0,-.8,0)),48);
  if(boomEl.classList.contains('on'))place(boomEl,V3(0,6,-14),60);
  cx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);cx.clearRect(0,0,W,H);
  if(confettiOn){bits.forEach(b=>{b.x+=b.vx*dt;b.y+=b.vy*dt;b.r+=b.vr*dt;if(b.y>H+20){b.y=-20;b.x=Math.random()*W;}cx.save();cx.translate(b.x,b.y);cx.rotate(b.r);cx.fillStyle=b.c;cx.fillRect(-4,-2.5,8,5);cx.restore();});}
}
setPlay(true);go(0,false);
camera.position.copy(OV_T).add(OV_O);controls.target.copy(OV_T);
requestAnimationFrame(tick);
})();
</script>
